manifest_version: 1
vars:
  - name: project_name
    default: "MyApp"
  - name: app_slug
    default: "{{ .project_name | lower }}"
    pattern: '^[a-z][a-z0-9-]*$'
protected_literals:
  - "@xbcio/xkitora"
substitute:
  - from: "Xkitora"
    to: "{{ .project_name }}"
    paths: ["**/*.go"]
  - from: "xkitora"
    to: "{{ .app_slug }}"
    paths: ["go.mod", "**/*.sh"]
render:
  - paths: ["**/*.tmpl"]
    strip_suffix: ".tmpl"
rename:
  - from: "xkitora"
    to: "{{ .app_slug }}"
exclude:
  paths: ["dist/**"]
